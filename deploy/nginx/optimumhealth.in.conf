# ============================================================================
#  MAIN WEBSITE  —  https://optimumhealth.in  (+ www)
#  File:  /etc/nginx/sites-available/optimumhealth.in.conf
#  Put the main-site files in:  /var/www/optimum-main
#
#  ⚠️ ASSUMPTION: the main site is a STATIC site (HTML, or a built React/Vite
#     dist). If it is instead WordPress/PHP or its own Node app, tell me and I'll
#     swap the block below for a PHP-FPM root or a proxy_pass — the SSL/certbot
#     flow stays identical either way.
#
#  Start with ONLY this :80 block, then run certbot (see DEPLOYMENT.md) — it adds
#  the :443 SSL block + HTTP->HTTPS redirect, and will also redirect www->non-www.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name optimumhealth.in www.optimumhealth.in;

    root /var/www/optimum-main;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Works for both a plain multi-page static site and a single-page app:
    # serve the file if it exists, else fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
