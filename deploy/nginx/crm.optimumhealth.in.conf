# ============================================================================
#  CRM FRONTEND  —  https://crm.optimumhealth.in   (static React / Vite build)
#  File:  /etc/nginx/sites-available/crm.optimumhealth.in.conf
#  Put the CRM build (contents of OptimumFE dist) in:  /var/www/optimum-crm
#
#  Start with ONLY this :80 block, then run certbot (see DEPLOYMENT.md) — it
#  adds the :443 SSL block + HTTP->HTTPS redirect automatically.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name crm.optimumhealth.in;

    root /var/www/optimum-crm;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache the fingerprinted build assets (index-XXXX.js etc.)
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — deep links like /leads/view/:id load on refresh (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so new deploys show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
