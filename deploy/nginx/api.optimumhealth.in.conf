# ============================================================================
#  BACKEND API  —  https://api.optimumhealth.in   (Node/Express via nginx proxy)
#  File:  /etc/nginx/sites-available/api.optimumhealth.in.conf
#
#  nginx terminates SSL and proxies to the Node app running on 127.0.0.1:<PORT>.
#  The Node app stays plain HTTP on that port — no code change needed.
#
#  ⚠️  Set <PORT> below to the SAME value as PORT in the backend .env file.
#      (The old server used 5001; change here if yours differs.)
#
#  Start with ONLY this :80 block, then run certbot (see DEPLOYMENT.md) — it
#  adds the :443 SSL block and HTTP->HTTPS redirect automatically.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.optimumhealth.in;

    # ⚠️ CRITICAL: the API accepts uploads/JSON up to 100 MB (bulk lead/appointment
    # upload, documents). nginx default is 1 MB and would reject them with HTTP 413.
    # This MUST match the express json/urlencoded limit (100mb) in app.js.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5001;   # <-- change 5001 to your .env PORT

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # lets Express know it's HTTPS
        proxy_set_header X-Forwarded-Host  $host;

        # Big bulk uploads can take a while to process — generous timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # The Node app already gzips responses (compression middleware). nginx
        # passes the client's Accept-Encoding through and relays the gzipped
        # body untouched — so leave encoding alone here (do NOT re-compress).
    }
}
